format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "#86BBD8"

[character]
success_symbol = "[❯](#06969A)"
# TODO(human): give palette slot 6 (hex `#33658A`) a home in this file.
# It must appear exactly once so `find_base` validates, and it only renders
# differently from slot 2 in the "popos" palette (accent `#FAA05A`).
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "#434C5E"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](#3B4252) ($ahead_behind$stashed)]($style)"
style = "#434C5E"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#4C566A"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "#434C5E"